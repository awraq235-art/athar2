<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" width="100%" height="100%">
  <defs>
    <!-- Gradients for subtle depth matching official print -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88C734" />
      <stop offset="100%" stop-color="#65A61E" />
    </linearGradient>

    <linearGradient id="leftFieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24783B" />
      <stop offset="100%" stop-color="#16592A" />
    </linearGradient>

    <linearGradient id="rightFieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84C62C" />
      <stop offset="100%" stop-color="#68A51C" />
    </linearGradient>

    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18562B" />
      <stop offset="100%" stop-color="#0E3D1C" />
    </linearGradient>

    <clipPath id="landscapeClip">
      <!-- Outer boundary of the agricultural shield crest -->
      <path d="M 140 180 C 140 160, 360 160, 360 180 C 370 240, 310 320, 250 320 C 190 320, 130 240, 140 180 Z" />
    </clipPath>
  </defs>

  <!-- 1. TOP TYPOGRAPHY & SPROUTING BRANCH: "أثـر" + "ATHAR" -->
  <g id="athar-calligraphy" transform="translate(0, 0)">
    <!-- Sprouting Three Leaves (غصن الأوراق الثلاثية النامي من الألف) -->
    <!-- Large sweeping lower leaf (الورقة السفلية الكبيرة الممتدة يساراً) -->
    <path 
      d="M 172 108 C 140 100, 95 106, 52 118 C 35 123, 20 132, 12 142 C 16 148, 30 148, 48 140 C 90 120, 138 116, 172 114 Z" 
      fill="#7CB342" 
      stroke="#114728" 
      stroke-width="3"
      stroke-linejoin="round"
    />
    <!-- Leaf midrib vein (عروق الورقة) -->
    <path 
      d="M 170 110 C 130 115, 80 125, 25 140" 
      fill="none" 
      stroke="#114728" 
      stroke-width="2.5" 
      stroke-linecap="round"
    />

    <!-- Middle upper fresh leaf (الورقة العلوية الممتدة للأعلى واليسار) -->
    <path 
      d="M 165 98 C 150 72, 130 52, 102 52 C 96 52, 92 56, 96 66 C 104 88, 128 102, 165 102 Z" 
      fill="#84C62C" 
      stroke="#114728" 
      stroke-width="3"
      stroke-linejoin="round"
    />
    <path 
      d="M 163 100 C 140 85, 120 72, 98 60" 
      fill="none" 
      stroke="#114728" 
      stroke-width="2" 
      stroke-linecap="round"
    />

    <!-- Small budding leaf (البرعم الجانبي) -->
    <path 
      d="M 168 85 C 158 75, 142 70, 130 74 C 132 82, 146 90, 168 90 Z" 
      fill="#9CCC65" 
      stroke="#114728" 
      stroke-width="2.5"
    />

    <!-- The Arabic Letters "أثــــر" in bold stylized dark green script -->
    <!-- Hamza above Alif (همزة الألف) -->
    <path 
      d="M 360 48 C 360 40, 368 34, 376 34 C 382 34, 386 38, 386 44 C 386 48, 380 52, 372 55 L 388 55 L 386 60 L 364 60 C 362 56, 360 52, 360 48 Z" 
      fill="#114728"
    />

    <!-- Alif vertical trunk (جذع الألف الممتد) -->
    <path 
      d="M 364 70 L 384 70 L 384 135 L 364 135 Z" 
      fill="#114728"
    />

    <!-- Letter "ث" and horizontal connecting baseline -->
    <!-- The 3 dots above Tha (نقاط الثاء الثلاث) -->
    <circle cx="316" cy="62" r="5" fill="#114728" />
    <circle cx="332" cy="62" r="5" fill="#114728" />
    <circle cx="324" cy="48" r="5" fill="#114728" />

    <!-- Letter body "ثـر" -->
    <!-- Tha tooth and baseline running to Raa -->
    <path 
      d="M 334 85 L 314 85 L 314 105 L 175 105 L 175 125 L 334 125 Z" 
      fill="#114728"
    />

    <!-- Raa curving terminal (جسم وحرف الراء المنحدر) -->
    <path 
      d="M 178 105 C 178 120, 172 138, 158 152 C 150 160, 138 165, 126 168 L 122 155 C 132 152, 142 146, 148 138 C 154 130, 156 120, 156 105 Z" 
      fill="#114728"
    />

    <!-- Latin Name "A T H A R" with wide tracking below the Arabic word -->
    <text 
      x="255" 
      y="170" 
      text-anchor="middle" 
      fill="#114728" 
      font-size="28" 
      font-weight="800" 
      font-family="'Times New Roman', 'Baskerville', 'Playfair Display', serif" 
      letter-spacing="0.32em"
    >
      ATHAR
    </text>
  </g>

  <!-- 2. CENTRAL EMBLEM: Agricultural Landscape & Terraces -->
  <g id="landscape-crest">
    <!-- Clip boundary container -->
    <g clip-path="url(#landscapeClip)">
      <!-- Background white sky/horizon -->
      <rect x="120" y="150" width="260" height="180" fill="#FFFFFF" />

      <!-- Tree silhouettes on the horizon (الأشجار الخضراء في الأفق) -->
      <!-- Left tree grove -->
      <path 
        d="M 130 190 C 130 175, 145 165, 160 170 C 170 162, 190 165, 198 175 C 205 168, 225 170, 230 185 L 130 195 Z" 
        fill="#134725" 
      />
      <!-- Right tree grove -->
      <path 
        d="M 270 185 C 280 168, 305 165, 320 175 C 330 165, 355 170, 365 188 L 270 195 Z" 
        fill="#134725" 
      />

      <!-- Right sunny agricultural hillside (التلال الزراعية الفاتحة يميناً) -->
      <path 
        d="M 190 195 Q 280 180, 370 215 L 370 330 L 190 330 Z" 
        fill="url(#rightFieldGrad)" 
      />

      <!-- Left dark agricultural terrace (الحقول الخضراء الداكنة يساراً) -->
      <path 
        d="M 130 190 Q 180 205, 235 220 L 235 330 L 130 330 Z" 
        fill="url(#leftFieldGrad)" 
      />

      <!-- Winding agricultural road / irrigation canal in deep perspective (طريق ومسار السيل/الري الممتد) -->
      <path 
        d="M 215 190 Q 235 220, 245 240 Q 275 275, 340 315 L 290 330 Q 240 280, 220 250 Q 205 225, 200 190 Z" 
        fill="url(#roadGrad)" 
      />

      <!-- Front-left rolling meadow layer -->
      <path 
        d="M 130 225 Q 175 245, 215 270 L 210 330 L 130 330 Z" 
        fill="#2A8543" 
      />

      <!-- Foreground right terrace rim -->
      <path 
        d="M 265 245 Q 315 235, 370 260 L 370 330 L 260 330 Z" 
        fill="#8CD12E" 
      />
    </g>

    <!-- Dynamic Double Crescent Swoosh Frame around the bottom -->
    <!-- Inner bright light-green swoop (القوس الأخضر الفاتح الداخلي) -->
    <path 
      d="M 140 215 C 130 270, 185 332, 250 332 C 315 332, 370 270, 360 215 C 362 230, 355 285, 310 322 C 275 342, 225 342, 190 322 C 145 285, 138 230, 140 215 Z" 
      fill="#88C72B" 
    />

    <!-- Outer bold dark-green crescent wrap (القوس الأخضر الداكن الخارجي الحاضن) -->
    <path 
      d="M 115 185 C 105 270, 168 360, 250 360 C 332 360, 395 270, 385 185 C 390 220, 380 295, 325 345 C 285 372, 215 372, 175 345 C 120 295, 110 220, 115 185 Z" 
      fill="#114728" 
    />
  </g>

  <!-- 3. OFFICIAL BILINGUAL TITLES BELOW THE CREST -->
  <!-- Arabic Title (الاسم العربي الرسمي للجمعية) -->
  <text 
    x="250" 
    y="412" 
    text-anchor="middle" 
    fill="#114728" 
    font-size="20.5" 
    font-weight="900" 
    font-family="'Cairo', 'Readex Pro', 'Tajawal', 'Almarai', system-ui, sans-serif"
  >
    جمعية أثر التعاونية الزراعية متعددة الأغراض
  </text>

  <!-- English Title (الاسم الإنجليزي الرسمي المعتمد) -->
  <text 
    x="250" 
    y="438" 
    text-anchor="middle" 
    fill="#114728" 
    font-size="14" 
    font-weight="700" 
    font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif"
    letter-spacing="0.01em"
  >
    Athar Agricultural Cooperative Association multi-purpose
  </text>
</svg>
